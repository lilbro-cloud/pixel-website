<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Market</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #eeeeee;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      font-size: 22px;
    }

    .canvas-container {
      width: 100%;
      overflow: auto;
      background: #dddddd;
      padding: 10px;
    }

    canvas {
      display: block;
      width: 1000px;
      height: 1000px;
      background: white;
      border: 1px solid #000000;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <h1>Pixel Market</h1>

  <div class="canvas-container">
    <canvas id="pixelCanvas"
            width="1000"
            height="1000"></canvas>
  </div>

<script>

const canvas = document.getElementById("pixelCanvas");
const ctx = canvas.getContext("2d");

const gridSize = 10;

ctx.clearRect(0, 0, 1000, 1000);
ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, 1000, 1000);

ctx.beginPath();
ctx.strokeStyle = "#000000";
ctx.lineWidth = 1;

for (let i = 0; i <= 1000; i += gridSize) {
  ctx.moveTo(i, 0);
  ctx.lineTo(i, 1000);
  ctx.moveTo(0, i);
  ctx.lineTo(1000, i);
}

ctx.stroke();
}

</script>
  
</body>
</html>
